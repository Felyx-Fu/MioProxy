[package]
name = "mioproxy"
version = "1.0.3"
description = "A Windows desktop proxy client powered by a separate Mihomo core"
authors = ["Felyx"]
edition = "2021"
default-run = "mioproxy"

[features]
default = []
# Opt-in validation build only. The default/release build does not expose this command.
validation-fault-injection = []

[[bin]]
name = "mioproxy"
path = "src/main.rs"

[[bin]]
name = "mioproxy-service"
path = "src/bin/mioproxy-service.rs"

[[bin]]
name = "verify-updater-signature"
path = "src/bin/verify-updater-signature.rs"

[lib]
name = "mioproxy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = "0.4"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2.4.3"
tauri-plugin-updater = "2.10.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
semver = "1"
time = { version = "0.3", features = ["formatting"] }
base64 = "0.22"
minisign-verify = "=0.2.5"
percent-encoding = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
futures-util = "0.3"
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
winreg = "0.55"
windows-sys = { version = "0.60", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Graphics_Gdi", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinInet", "Win32_Networking_WinSock", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_Memory", "Win32_System_Pipes", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_UI_HiDpi", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
getrandom = "0.3"
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows-service = "0.8.1"
