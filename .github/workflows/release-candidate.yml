name: MioProxy Signed Release Candidate

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Source branch or commit to build as the signed RC
        required: false
        default: main
        type: string
      expected_version:
        description: Optional expected product version; defaults to the repository version
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  windows-release-candidate:
    name: Windows x86_64 signed RC
    runs-on: windows-latest
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      MIOPROXY_AUTHENTICODE_CERTIFICATE_PASSWORD: ${{ secrets.MIOPROXY_AUTHENTICODE_CERTIFICATE_PASSWORD }}
      MIOPROXY_AUTHENTICODE_TIMESTAMP_URL: ${{ secrets.MIOPROXY_AUTHENTICODE_TIMESTAMP_URL || 'http://timestamp.digicert.com' }}
    steps:
      - name: Check out requested source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Resolve and verify repository product version
        id: resolve_version
        shell: pwsh
        env:
          EXPECTED_VERSION: ${{ inputs.expected_version }}
        run: |
          $expected = [string]$env:EXPECTED_VERSION
          if ([string]::IsNullOrWhiteSpace($expected)) {
            & powershell -NoProfile -ExecutionPolicy Bypass -File ./scripts/check-version-consistency.ps1
          } else {
            & powershell -NoProfile -ExecutionPolicy Bypass -File ./scripts/check-version-consistency.ps1 -ExpectedVersion $expected.Trim()
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $version = [string](Get-Content -Raw ./package.json | ConvertFrom-Json).version
          if ([string]::IsNullOrWhiteSpace($version)) {
            throw "The repository product version resolved to an empty value."
          }
          "MIOPROXY_RELEASE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "artifact_name=MioProxy-$version-signed-rc-$env:GITHUB_RUN_ID" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "Resolved signed RC product version: $version"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.5
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.93.0
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Verify lock files were not changed by npm ci
        shell: pwsh
        run: |
          git diff --exit-code -- package-lock.json src-tauri/Cargo.lock

      - name: Enforce production npm audit gate
        run: npm audit --omit=dev --audit-level=high

      - name: Verify updater signing secret is present
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw "TAURI_SIGNING_PRIVATE_KEY is not configured in GitHub Actions Secrets."
          }
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD)) {
            throw "TAURI_SIGNING_PRIVATE_KEY_PASSWORD is not configured for the encrypted signing key."
          }

      - name: Configure Authenticode signing certificate
        shell: pwsh
        env:
          WINDOWS_AUTHENTICODE_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_AUTHENTICODE_CERTIFICATE_BASE64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_AUTHENTICODE_CERTIFICATE_BASE64)) {
            throw "WINDOWS_AUTHENTICODE_CERTIFICATE_BASE64 is not configured."
          }
          if ([string]::IsNullOrWhiteSpace($env:MIOPROXY_AUTHENTICODE_CERTIFICATE_PASSWORD)) {
            throw "MIOPROXY_AUTHENTICODE_CERTIFICATE_PASSWORD is not configured."
          }
          if ([string]::IsNullOrWhiteSpace($env:MIOPROXY_AUTHENTICODE_TIMESTAMP_URL)) {
            throw "MIOPROXY_AUTHENTICODE_TIMESTAMP_URL is not configured."
          }
          $certificatePath = Join-Path $env:RUNNER_TEMP 'mioproxy-authenticode.pfx'
          $recordPath = Join-Path $env:RUNNER_TEMP 'mioproxy-authenticode-record.jsonl'
          Remove-Item -LiteralPath $recordPath -Force -ErrorAction SilentlyContinue
          [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:WINDOWS_AUTHENTICODE_CERTIFICATE_BASE64))
          "MIOPROXY_AUTHENTICODE_CERTIFICATE_PATH=$certificatePath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "MIOPROXY_AUTHENTICODE_RECORD_PATH=$recordPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Remove-Item Env:WINDOWS_AUTHENTICODE_CERTIFICATE_BASE64

      - name: Prepare official Mihomo sidecar
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run mihomo:setup

      - name: Verify pinned Mihomo packaging and source availability
        shell: pwsh
        run: |
          & powershell -NoProfile -ExecutionPolicy Bypass -File ./scripts/verify-mihomo-packaging.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify Windows dependency surface
        shell: pwsh
        run: |
          & powershell -NoProfile -ExecutionPolicy Bypass -File ./scripts/check-windows-dependency-surface.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate source
        run: |
          npm run build
          npm run test:ui
          cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
          cargo check --locked --manifest-path src-tauri/Cargo.toml
          cargo test --locked --manifest-path src-tauri/Cargo.toml
          cargo build --release --locked --manifest-path src-tauri/Cargo.toml --bin mioproxy --bin mioproxy-service
          cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings
          git diff --check

      - name: Fail if validation changed tracked files
        shell: pwsh
        run: |
          $trackedChanges = @(git diff --name-only)
          $untrackedChanges = @(git ls-files --others --exclude-standard)
          if ($trackedChanges.Count -gt 0 -or $untrackedChanges.Count -gt 0) {
            Write-Host ($trackedChanges + $untrackedChanges)
            throw "Release validation mutated tracked or untracked repository files."
          }

      - name: Clean exact RC output directory
        shell: pwsh
        run: Remove-Item -LiteralPath './src-tauri/target/release/bundle' -Recurse -Force -ErrorAction SilentlyContinue

      - name: Build signed Windows NSIS RC from deterministic inputs
        shell: pwsh
        run: |
          & npx tauri build --ci --config scripts/tauri-windows-release.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Assert V1 Windows packaging is NSIS-only
        shell: pwsh
        run: |
          & powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ./scripts/verify-nsis-release.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Record and verify RC hashes and Authenticode signatures
        shell: pwsh
        run: |
          & powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ./scripts/write-release-manifest.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ./scripts/verify-windows-release.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Write artifact-only updater metadata for the RC
        shell: pwsh
        env:
          RC_TAG: rc-${{ github.run_id }}
          RC_BASE_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts
        run: |
          & powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ./scripts/write-updater-manifest.ps1 -Tag $env:RC_TAG -BaseUrl $env:RC_BASE_URL -Notes 'Signed RC verification metadata; artifact-only and not an official updater endpoint.'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify NSIS updater metadata and signatures
        shell: pwsh
        run: |
          & powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ./scripts/verify-nsis-release.ps1 -RequireUpdaterMetadata
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload signed RC evidence only
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.resolve_version.outputs.artifact_name }}
          if-no-files-found: error
          retention-days: 14
          path: |
            src-tauri/target/release/bundle/nsis/MioProxy_*_x64-setup.exe
            src-tauri/target/release/bundle/nsis/MioProxy_*_x64-setup.exe.sig
            src-tauri/target/release/bundle/latest.json
            src-tauri/target/release/bundle/MioProxy-*-release-manifest.json
            src-tauri/target/release/bundle/MioProxy-*-SHA256SUMS.txt
            src-tauri/binaries/THIRD_PARTY_NOTICES.txt
            config/mihomo-release.json

      - name: Remove Authenticode certificate and hash-record material from the runner
        if: always()
        shell: pwsh
        run: |
          if ($env:MIOPROXY_AUTHENTICODE_CERTIFICATE_PATH -and (Test-Path -LiteralPath $env:MIOPROXY_AUTHENTICODE_CERTIFICATE_PATH)) {
            Remove-Item -LiteralPath $env:MIOPROXY_AUTHENTICODE_CERTIFICATE_PATH -Force
          }
          if ($env:MIOPROXY_AUTHENTICODE_RECORD_PATH -and (Test-Path -LiteralPath $env:MIOPROXY_AUTHENTICODE_RECORD_PATH)) {
            Remove-Item -LiteralPath $env:MIOPROXY_AUTHENTICODE_RECORD_PATH -Force
          }
