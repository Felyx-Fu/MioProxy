name: MioProxy Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-release:
    name: Windows x86_64 release
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Verify release version is consistent
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $expected = $env:RELEASE_TAG.TrimStart('v')
          & powershell -NoProfile -ExecutionPolicy Bypass -File ./scripts/check-version-consistency.ps1 -ExpectedVersion $expected
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20.19.5
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@d8dfd7155fea72af4ad34a8fe97364d210e2d020 # 1.93.0
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Verify lock files were not changed by npm ci
        shell: pwsh
        run: |
          git diff --exit-code -- package-lock.json src-tauri/Cargo.lock

      - name: Enforce production npm audit gate
        run: npm audit --omit=dev --audit-level=high

      - name: Prepare official Mihomo sidecar
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run mihomo:setup

      - name: Verify pinned Mihomo packaging and source availability
        shell: pwsh
        run: |
          & powershell -NoProfile -ExecutionPolicy Bypass -File ./scripts/verify-mihomo-packaging.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify Windows dependency surface
        shell: pwsh
        run: |
          & powershell -NoProfile -ExecutionPolicy Bypass -File ./scripts/check-windows-dependency-surface.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate source
        run: |
          npm run build
          npm run test:ui
          npm run test:release-manifest
          cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
          cargo check --locked --manifest-path src-tauri/Cargo.toml
          cargo test --locked --manifest-path src-tauri/Cargo.toml
          cargo build --release --locked --manifest-path src-tauri/Cargo.toml --bin mioproxy --bin mioproxy-service
          cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings
          git diff --check

      - name: Fail if validation changed tracked files
        shell: pwsh
        run: |
          $trackedChanges = @(git diff --name-only)
          $untrackedChanges = @(git ls-files --others --exclude-standard)
          if ($trackedChanges.Count -gt 0 -or $untrackedChanges.Count -gt 0) {
            Write-Host ($trackedChanges + $untrackedChanges)
            throw "Release validation mutated tracked or untracked repository files."
          }

      - name: Clean exact release output directory
        shell: pwsh
        run: Remove-Item -LiteralPath './src-tauri/target/release/bundle' -Recurse -Force -ErrorAction SilentlyContinue

      - name: Build deterministic-input updater-signed Windows bundles from the checked-out tag
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) { throw "TAURI_SIGNING_PRIVATE_KEY is not configured." }
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD)) { throw "TAURI_SIGNING_PRIVATE_KEY_PASSWORD is not configured." }
          & npx tauri build --ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Assert V1 Windows packaging is NSIS-only
        shell: pwsh
        run: |
          & powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ./scripts/verify-nsis-release.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Record and verify release hashes and updater signatures
        shell: pwsh
        run: |
          & powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ./scripts/write-release-manifest.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ./scripts/verify-windows-release.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Write updater manifest for the exact verified artifacts
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          & powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ./scripts/write-updater-manifest.ps1 -Tag $env:RELEASE_TAG
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify NSIS updater metadata and cryptographic Tauri updater signature
        shell: pwsh
        run: |
          & powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ./scripts/verify-nsis-release.ps1 -RequireUpdaterMetadata
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Exercise Tauri updater signature tamper resistance
        shell: pwsh
        run: |
          & powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ./scripts/tests/verify-updater-signature.test.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Publish exact verified release assets
        uses: softprops/action-gh-release@da05d552573ad5aba039eaac05058a918a7bf631 # v2.2.2
        with:
          tag_name: ${{ github.ref_name }}
          name: MioProxy ${{ github.ref_name }}
          body: Tauri updater-signed Windows x86_64 NSIS release for MioProxy. SHA-256 manifests and updater signatures are included; MSI is not an official V1 artifact.
          draft: false
          prerelease: false
          files: |
            src-tauri/target/release/bundle/nsis/MioProxy_*_x64-setup.exe
            src-tauri/target/release/bundle/nsis/MioProxy_*_x64-setup.exe.sig
            src-tauri/target/release/bundle/latest.json
            src-tauri/target/release/bundle/MioProxy-*-release-manifest.json
            src-tauri/target/release/bundle/MioProxy-*-SHA256SUMS.txt
