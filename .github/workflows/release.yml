name: MioProxy Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-release:
    name: Windows x86_64 release
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Verify release version is consistent
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $expected = $env:RELEASE_TAG.TrimStart('v')
          & powershell -NoProfile -ExecutionPolicy Bypass -File ./scripts/check-version-consistency.ps1 -ExpectedVersion $expected
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20.19.5
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@d8dfd7155fea72af4ad34a8fe97364d210e2d020 # 1.93.0
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Verify lock files were not changed by npm ci
        shell: pwsh
        run: |
          git diff --exit-code -- package-lock.json src-tauri/Cargo.lock

      - name: Enforce production npm audit gate
        run: npm audit --omit=dev --audit-level=high

      - name: Prepare official Mihomo sidecar
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run mihomo:setup

      - name: Verify pinned Mihomo packaging and source availability
        shell: pwsh
        run: |
          & powershell -NoProfile -ExecutionPolicy Bypass -File ./scripts/verify-mihomo-packaging.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify Windows dependency surface
        shell: pwsh
        run: |
          & powershell -NoProfile -ExecutionPolicy Bypass -File ./scripts/check-windows-dependency-surface.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate source
        run: |
          npm run build
          npm run test:ui
          npm run test:release-manifest
          cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
          cargo check --locked --manifest-path src-tauri/Cargo.toml
          cargo test --locked --manifest-path src-tauri/Cargo.toml
          cargo build --release --locked --manifest-path src-tauri/Cargo.toml --bin mioproxy --bin mioproxy-service
          cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings
          git diff --check

      - name: Fail if validation changed tracked files
        shell: pwsh
        run: |
          $trackedChanges = @(git diff --name-only)
          $untrackedChanges = @(git ls-files --others --exclude-standard)
          if ($trackedChanges.Count -gt 0 -or $untrackedChanges.Count -gt 0) {
            Write-Host ($trackedChanges + $untrackedChanges)
            throw "Release validation mutated tracked or untracked repository files."
          }

      - name: Clean exact release output directory
        shell: pwsh
        run: Remove-Item -LiteralPath './src-tauri/target/release/bundle' -Recurse -Force -ErrorAction SilentlyContinue

      - name: Build deterministic-input signed Windows bundles from the checked-out tag
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          MIOPROXY_AUTHENTICODE_CERTIFICATE_PASSWORD: ${{ secrets.MIOPROXY_AUTHENTICODE_CERTIFICATE_PASSWORD }}
          MIOPROXY_AUTHENTICODE_TIMESTAMP_URL: ${{ secrets.MIOPROXY_AUTHENTICODE_TIMESTAMP_URL || 'http://timestamp.digicert.com' }}
          WINDOWS_AUTHENTICODE_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_AUTHENTICODE_CERTIFICATE_BASE64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) { throw "TAURI_SIGNING_PRIVATE_KEY is not configured." }
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD)) { throw "TAURI_SIGNING_PRIVATE_KEY_PASSWORD is not configured." }
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_AUTHENTICODE_CERTIFICATE_BASE64)) { throw "WINDOWS_AUTHENTICODE_CERTIFICATE_BASE64 is not configured." }
          if ([string]::IsNullOrWhiteSpace($env:MIOPROXY_AUTHENTICODE_CERTIFICATE_PASSWORD)) { throw "MIOPROXY_AUTHENTICODE_CERTIFICATE_PASSWORD is not configured." }
          if ([string]::IsNullOrWhiteSpace($env:MIOPROXY_AUTHENTICODE_TIMESTAMP_URL)) { throw "MIOPROXY_AUTHENTICODE_TIMESTAMP_URL is not configured." }
          $certificatePath = Join-Path $env:RUNNER_TEMP 'mioproxy-authenticode.pfx'
          $recordPath = Join-Path $env:RUNNER_TEMP 'mioproxy-authenticode-record.jsonl'
          Remove-Item -LiteralPath $recordPath -Force -ErrorAction SilentlyContinue
          try {
            [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:WINDOWS_AUTHENTICODE_CERTIFICATE_BASE64))
            $env:MIOPROXY_AUTHENTICODE_CERTIFICATE_PATH = $certificatePath
            $env:MIOPROXY_AUTHENTICODE_RECORD_PATH = $recordPath
            "MIOPROXY_AUTHENTICODE_RECORD_PATH=$recordPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            & npx tauri build --ci --config scripts/tauri-windows-release.json
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          finally {
            if (Test-Path -LiteralPath $certificatePath) { Remove-Item -LiteralPath $certificatePath -Force }
          }

      - name: Assert V1 Windows packaging is NSIS-only
        shell: pwsh
        run: |
          & powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ./scripts/verify-nsis-release.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Record and verify release hashes and Authenticode signatures
        shell: pwsh
        env:
          EXPECTED_AUTHENTICODE_SIGNER_THUMBPRINT: ${{ vars.MIOPROXY_AUTHENTICODE_SIGNER_THUMBPRINT }}
          EXPECTED_AUTHENTICODE_SIGNER_SUBJECT: ${{ vars.MIOPROXY_AUTHENTICODE_SIGNER_SUBJECT }}
        run: |
          & powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ./scripts/write-release-manifest.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ([string]::IsNullOrWhiteSpace($env:EXPECTED_AUTHENTICODE_SIGNER_THUMBPRINT)) { throw "MIOPROXY_AUTHENTICODE_SIGNER_THUMBPRINT repository variable is required." }
          & powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ./scripts/verify-windows-release.ps1 -ExpectedSignerThumbprint $env:EXPECTED_AUTHENTICODE_SIGNER_THUMBPRINT -ExpectedSignerSubject $env:EXPECTED_AUTHENTICODE_SIGNER_SUBJECT
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Write updater manifest for the exact verified artifacts
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          & powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ./scripts/write-updater-manifest.ps1 -Tag $env:RELEASE_TAG
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify NSIS updater metadata and signatures
        shell: pwsh
        run: |
          & powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ./scripts/verify-nsis-release.ps1 -RequireUpdaterMetadata
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Publish exact verified release assets
        uses: softprops/action-gh-release@da05d552573ad5aba039eaac05058a918a7bf631 # v2.2.2
        with:
          tag_name: ${{ github.ref_name }}
          name: MioProxy ${{ github.ref_name }}
          body: Signed Windows x86_64 NSIS release for MioProxy. SHA-256 and Authenticode records are included; MSI is not an official V1 artifact.
          draft: false
          prerelease: false
          files: |
            src-tauri/target/release/bundle/nsis/MioProxy_*_x64-setup.exe
            src-tauri/target/release/bundle/nsis/MioProxy_*_x64-setup.exe.sig
            src-tauri/target/release/bundle/latest.json
            src-tauri/target/release/bundle/MioProxy-*-release-manifest.json
            src-tauri/target/release/bundle/MioProxy-*-SHA256SUMS.txt

      - name: Remove Authenticode certificate material from the runner
        if: always()
        shell: pwsh
        run: |
          if ($env:MIOPROXY_AUTHENTICODE_CERTIFICATE_PATH -and (Test-Path -LiteralPath $env:MIOPROXY_AUTHENTICODE_CERTIFICATE_PATH)) {
            Remove-Item -LiteralPath $env:MIOPROXY_AUTHENTICODE_CERTIFICATE_PATH -Force
          }
          if ($env:MIOPROXY_AUTHENTICODE_RECORD_PATH -and (Test-Path -LiteralPath $env:MIOPROXY_AUTHENTICODE_RECORD_PATH)) {
            Remove-Item -LiteralPath $env:MIOPROXY_AUTHENTICODE_RECORD_PATH -Force
          }
