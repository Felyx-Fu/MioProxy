name: MioProxy Release Readiness

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-readiness:
    name: Windows pre-tag readiness
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20.19.5
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@d8dfd7155fea72af4ad34a8fe97364d210e2d020 # 1.93.0
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy

      - name: Verify repository version and lock consistency
        shell: pwsh
        run: |
          & powershell -NoProfile -ExecutionPolicy Bypass -File ./scripts/check-version-consistency.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Verify lock files after npm ci
        shell: pwsh
        run: |
          git diff --exit-code -- package-lock.json src-tauri/Cargo.lock

      - name: Enforce production npm audit gate
        run: npm audit --omit=dev --audit-level=high

      - name: Prepare official Mihomo sidecar
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run mihomo:setup

      - name: Verify pinned Mihomo packaging and source availability
        shell: pwsh
        run: |
          & powershell -NoProfile -ExecutionPolicy Bypass -File ./scripts/verify-mihomo-packaging.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify Windows dependency surface
        shell: pwsh
        run: |
          & powershell -NoProfile -ExecutionPolicy Bypass -File ./scripts/check-windows-dependency-surface.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run locked source gates
        run: |
          npm run build
          npm run test:ui
          npm run test:release-manifest
          cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
          cargo check --locked --manifest-path src-tauri/Cargo.toml
          cargo test --locked --manifest-path src-tauri/Cargo.toml
          cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings
          cargo build --release --locked --manifest-path src-tauri/Cargo.toml --bin mioproxy --bin mioproxy-service
          git diff --check

      - name: Build unsigned Windows installers without publishing
        shell: pwsh
        run: |
          Remove-Item -LiteralPath './src-tauri/target/release/bundle' -Recurse -Force -ErrorAction SilentlyContinue
          $configPath = Join-Path $env:RUNNER_TEMP 'mioproxy-readiness-tauri-config.json'
          $configJson = '{"bundle":{"createUpdaterArtifacts":false}}'
          [IO.File]::WriteAllText($configPath, $configJson, [Text.UTF8Encoding]::new($false))
          try {
            & npx tauri build --ci --no-sign --config $configPath
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          finally {
            if (Test-Path -LiteralPath $configPath) { Remove-Item -LiteralPath $configPath -Force }
          }

      - name: Assert V1 Windows packaging is NSIS-only
        shell: pwsh
        run: |
          & powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ./scripts/verify-nsis-release.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Fail if readiness validation changed repository files
        shell: pwsh
        run: |
          $changes = git status --porcelain
          if ($changes) {
            Write-Host $changes
            throw "Release readiness validation mutated tracked or untracked repository files."
          }
